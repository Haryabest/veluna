# Veluna — full stack for deployment on a new machine (Docker only).
#
# Usage:
#   cp .env.example .env   # fill secrets and TELEGRAM_WEBAPP_URL
#   docker compose -f docker-compose.deploy.yml up -d --build
#   open http://localhost
#
# Bot on Windows: Telegram API often fails inside Docker — run on host:
#   .\scripts\run-bot-local.ps1

services:
  postgres:
    image: postgres:16-alpine
    container_name: veluna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veluna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veluna_secret}
      POSTGRES_DB: ${POSTGRES_DB:-veluna}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veluna}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veluna-network

  redis:
    image: redis:7-alpine
    container_name: veluna-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veluna-network

  minio:
    image: minio/minio:latest
    container_name: veluna-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-veluna_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-veluna_minio_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - veluna-network

  minio-init:
    image: minio/mc:latest
    container_name: veluna-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set veluna http://minio:9000 ${MINIO_ACCESS_KEY:-veluna_minio} ${MINIO_SECRET_KEY:-veluna_minio_secret};
      mc mb --ignore-existing veluna/${MINIO_BUCKET:-veluna};
      mc anonymous set download veluna/${MINIO_BUCKET:-veluna}/previews;
      mc anonymous set download veluna/${MINIO_BUCKET:-veluna}/characters;
      mc anonymous set download veluna/${MINIO_BUCKET:-veluna}/generations;
      exit 0;
      "
    networks:
      - veluna-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: /media
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-zimage}
      ZIMAGE_BASE_URL: ${ZIMAGE_BASE_URL:-https://api.gen-api.ru/api/v1/networks/z-image}
      ZIMAGE_TIMEOUT_SECONDS: ${ZIMAGE_TIMEOUT_SECONDS:-180}
      CIVITAI_API_TOKEN: ${CIVITAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - veluna-network

  celery-worker-generation:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-worker-generation
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q generation_queue -c 2 --loglevel=info -n generation@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      MINIO_ENDPOINT: minio:9000
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-zimage}
      ZIMAGE_BASE_URL: ${ZIMAGE_BASE_URL:-https://api.gen-api.ru/api/v1/networks/z-image}
      ZIMAGE_TIMEOUT_SECONDS: ${ZIMAGE_TIMEOUT_SECONDS:-180}
      CIVITAI_API_TOKEN: ${CIVITAI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - veluna-network

  celery-worker-chat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-worker-chat
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q chat_queue -c 4 --loglevel=info -n chat@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - veluna-network

  celery-worker-analytics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-worker-analytics
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q analytics_queue -c 2 --loglevel=info -n analytics@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - veluna-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - veluna-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        BACKEND_HOST: backend
        BACKEND_PORT: "8000"
        MINIO_HOST: minio
        MINIO_PORT: "9000"
    container_name: veluna-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - veluna-network

  nginx:
    image: nginx:alpine
    container_name: veluna-nginx
    restart: unless-stopped
    ports:
      - "${VELUNA_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - veluna-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  veluna-network:
    driver: bridge
