services:
  postgres:
    image: postgres:16-alpine
    container_name: veluna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veluna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veluna_secret}
      POSTGRES_DB: ${POSTGRES_DB:-veluna}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veluna}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veluna-network

  redis:
    image: redis:7-alpine
    container_name: veluna-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veluna-network

  minio:
    image: minio/minio:latest
    container_name: veluna-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-veluna_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-veluna_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - veluna-network

  minio-init:
    image: minio/mc:latest
    container_name: veluna-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set veluna http://minio:9000 ${MINIO_ACCESS_KEY:-veluna_minio} ${MINIO_SECRET_KEY:-veluna_minio_secret};
      mc mb --ignore-existing veluna/${MINIO_BUCKET:-veluna};
      mc anonymous set download veluna/${MINIO_BUCKET:-veluna}/previews;
      mc anonymous set download veluna/${MINIO_BUCKET:-veluna}/characters;
      mc anonymous set download veluna/${MINIO_BUCKET:-veluna}/generations;
      exit 0;
      "
    networks:
      - veluna-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      MINIO_ENDPOINT: minio:9000
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-zimage}
      ZIMAGE_BASE_URL: ${ZIMAGE_BASE_URL:-https://api.gen-api.ru/api/v1/networks/z-image}
      ZIMAGE_TIMEOUT_SECONDS: ${ZIMAGE_TIMEOUT_SECONDS:-180}
      CIVITAI_API_TOKEN: ${CIVITAI_API_KEY:-}
    volumes:
      - ./backend:/app
    ports:
      - "8020:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - veluna-network

  celery-worker-generation:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-worker-generation
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q generation_queue -c 2 --loglevel=info -n generation@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      MINIO_ENDPOINT: minio:9000
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-zimage}
      ZIMAGE_BASE_URL: ${ZIMAGE_BASE_URL:-https://api.gen-api.ru/api/v1/networks/z-image}
      ZIMAGE_TIMEOUT_SECONDS: ${ZIMAGE_TIMEOUT_SECONDS:-180}
      CIVITAI_API_TOKEN: ${CIVITAI_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    networks:
      - veluna-network

  celery-worker-chat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-worker-chat
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q chat_queue -c 4 --loglevel=info -n chat@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    networks:
      - veluna-network

  celery-worker-analytics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-worker-analytics
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q analytics_queue -c 2 --loglevel=info -n analytics@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    networks:
      - veluna-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - veluna-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        BACKEND_HOST: backend
        BACKEND_PORT: "8000"
        MINIO_HOST: minio
        MINIO_PORT: "9000"
    container_name: veluna-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - veluna-network

  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veluna-telegram-bot
    restart: unless-stopped
    command: python -m app.bot.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veluna}:${POSTGRES_PASSWORD:-veluna_secret}@postgres:5432/${POSTGRES_DB:-veluna}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      ADMIN_TELEGRAM_USERNAMES: ${ADMIN_TELEGRAM_USERNAMES:-Iabobuss}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - veluna-network

  nginx:
    image: nginx:alpine
    container_name: veluna-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - veluna-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  veluna-network:
    driver: bridge
